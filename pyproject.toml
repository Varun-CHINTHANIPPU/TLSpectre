[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tls13-hardening-lab"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "PyYAML>=6.0,<7", "cryptography>=43,<48", "numpy>=1.26",
  "pandas>=2.2", "pyarrow>=16", "scipy>=1.15",
  "statsmodels>=0.14", "psutil>=5.9", "matplotlib>=3.9"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.setuptools]
package-dir = {"" = "harness"}

[tool.setuptools.packages.find]
where = ["harness"]

[tool.pytest.ini_options]
testpaths = ["tests"]
