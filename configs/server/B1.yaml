# Vendor-ish dual-stack baseline. No hardening security override or suite/group allow-list.
provider: SunJSSE
bindHost: 127.0.0.1
httpsPort: 8443
httpPort: 8080
keyStore: pki/out/srv_plain.p12
protocols: [TLSv1.2, TLSv1.3]
cipherSuites: []
namedGroups: []
hsts: false
httpRedirect: false
sniHostCheck: false
sessionCache: true
ocspStapling: false
ocspResponderUri: http://127.0.0.1:8888
