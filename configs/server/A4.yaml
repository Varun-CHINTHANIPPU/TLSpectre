# E3/E4 A4 ablation: disable AES/GHASH intrinsics; fail on unrecognized JVM flags.
provider: SunJSSE
bindHost: 127.0.0.1
httpsPort: 8443
httpPort: 8080
keyStore: pki/out/srv_plain.p12
protocols: [TLSv1.3]
cipherSuites: [TLS_AES_256_GCM_SHA384, TLS_AES_128_GCM_SHA256, TLS_CHACHA20_POLY1305_SHA256]
namedGroups: [x25519]
hsts: true
httpRedirect: true
sniHostCheck: true
sessionCache: false
ocspStapling: false
jvmFlags: ['-XX:+UnlockDiagnosticVMOptions', '-XX:-UseAES', '-XX:-UseAESIntrinsics', '-XX:-UseAESCTRIntrinsics', '-XX:-UseGHASHIntrinsics']
maxPayloadBytes: 536870912
